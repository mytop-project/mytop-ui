name: Compose Native spike

# Spike only, never merged: does compose-native (Compose compiled with Kotlin/Native, no JVM at
# runtime) build and render for linuxX64, linuxArm64 and Windows x64, and what does it cost.
# The Kotlin/Native compiler does not run on an arm64 Linux host (the build warns that the host
# platform is not supported), so linuxArm64 is cross-linked on x64 against an arm64 sysroot taken
# from the arm64 runner, and then run and measured on the arm64 runner.
on:
  push:
    branches: ["ci/compose-native-spike"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The patched compose-native: release v<CN_VERSION> of mytop-project/compose-native, its sha256 pinned here.
  CN_VERSION: 1.13.0-beta01-mytop.1
  CN_SHA256: 5ace9958184fa4a1a5d331cda484a908696506a9bcab54d966d5260332bae3c1
  SDL_TAG: release-3.2.30
  DEV_PACKAGES: >-
    build-essential cmake ninja-build pkg-config git file
    libfontconfig1-dev libdbus-1-dev libegl-dev libgl-dev libgles-dev libgbm-dev
    libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev
    libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols
    libdrm-dev libudev-dev libasound2-dev libpulse-dev libdecor-0-dev
    xvfb x11-apps imagemagick libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-utils

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch the patched compose-native repository (mytop-project/compose-native, branch mytop)
        shell: bash
        run: |
          set -euo pipefail
          temp="$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")"
          mkdir -p "$temp/cn-maven"
          base="https://github.com/mytop-project/compose-native/releases/download/v$CN_VERSION"
          curl --fail --location --silent --show-error --output "$temp/cn-maven.tar.gz"             "$base/compose-native-maven-$CN_VERSION.tar.gz"
          echo "$CN_SHA256  $temp/cn-maven.tar.gz" | sha256sum --check
          tar --force-local -xzf "$temp/cn-maven.tar.gz" -C "$temp/cn-maven"
          echo "CN_REPO=$temp/cn-maven" >> "$GITHUB_ENV"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $DEV_PACKAGES
      - name: Cache SDL3
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: /opt/sdl3
          key: sdl3-${{ env.SDL_TAG }}-x64-v1
      - name: Build SDL3 (Ubuntu 24.04 has no libsdl3)
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL /tmp/sdl
          cmake -S /tmp/sdl -B /tmp/sdl/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/sdl3 -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build /tmp/sdl/build
          cmake --install /tmp/sdl/build
      - name: Install SDL3
        run: |
          sudo cp -a /opt/sdl3/lib/. /usr/local/lib/ 2>/dev/null || sudo cp -a /opt/sdl3/lib*/. /usr/local/lib/
          sudo cp -a /opt/sdl3/include/. /usr/local/include/
          sudo ldconfig
      - name: Build
        working-directory: spike/compose-native
        env:
          LINUX_X64_NATIVE_LIBRARY_DIRS: /usr/local/lib
        run: ./gradlew --no-daemon --stacktrace linkReleaseExecutableLinuxX64
      - name: Measure
        working-directory: spike/compose-native
        run: |
          bin=$(find build/bin/linuxX64 -type f -path '*releaseExecutable*' -name '*.kexe' | head -n1)
          echo "binary: $bin"
          ci/report-linux.sh "$bin" "$PWD/out"
      - name: "Clean exit under Xvfb, no _exit and no shim, must exit 0 with no X error"
        working-directory: spike/compose-native
        run: |
          bin=$(find build/bin/linuxX64 -type f -path '*releaseExecutable*' -name '*.kexe' | head -n1)
          export LD_LIBRARY_PATH=/usr/local/lib LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEODRIVER=x11
          set +e
          timeout 120 xvfb-run -a -s "-screen 0 1280x800x24" "$bin" --measure --clean-exit >out/clean-exit.txt 2>out/clean-exit.err
          code=$?
          set -e
          cat out/clean-exit.txt out/clean-exit.err
          echo "CLEAN-EXIT: exit code=$code, compose-native=$CN_VERSION"
          if grep -q 'X Error' out/clean-exit.txt out/clean-exit.err; then echo "CLEAN-EXIT: an X error was printed"; exit 1; fi
          test "$code" -eq 0
      - name: Exit bug diagnostic (no _exit; X calls traced and synchronous)
        working-directory: spike/compose-native
        continue-on-error: true
        run: |
          bin=$(find build/bin/linuxX64 -type f -path '*releaseExecutable*' -name '*.kexe' | head -n1)
          gcc -shared -fPIC -o out/xtrace-shim.so ci/xtrace-shim.c -ldl -lX11
          export LD_LIBRARY_PATH=/usr/local/lib LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEODRIVER=x11
          set +e
          LD_PRELOAD=$PWD/out/xtrace-shim.so timeout 120 xvfb-run -a -s "-screen 0 1280x800x24"             "$bin" --measure --clean-exit >out/exitdiag.txt 2>out/exitdiag.err
          code=$?
          echo "exit=$code" | tee -a out/exitdiag.txt
          xerrors=$(grep -c '^X Error' out/exitdiag.txt || true)
          echo "VERDICT: clean exit code=$code, X errors=$xerrors, compose-native=$CN_VERSION"
          # resolve frames that fall in the executable to function names
          grep -E 'XTRACE   #[0-9]+ .*[.]kexe' out/exitdiag.err | sed -E 's/.*[+]0x([0-9a-f]+) .*/\1/' | sort -u | xargs -r addr2line -f -C -e "$bin" > out/exitdiag.symbols.txt || true
          echo '```'; grep -vE 'XTRACE   #' out/exitdiag.err | head -60; echo '```'
          echo "--- last 3 XDestroyWindow/XDeleteProperty records with frames"
          grep -E 'XTRACE (XDestroyWindow|XDeleteProperty)' -A12 out/exitdiag.err | tail -80
          cat out/exitdiag.symbols.txt | head -80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linuxX64
          path: spike/compose-native/out

  arm64-sysroot:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $DEV_PACKAGES
      - name: Cache SDL3
        id: sdl-cache
        uses: actions/cache@v4
        with:
          path: /opt/sdl3
          key: sdl3-${{ env.SDL_TAG }}-arm64-v1
      - name: Build SDL3
        if: steps.sdl-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL_TAG" https://github.com/libsdl-org/SDL /tmp/sdl
          cmake -S /tmp/sdl -B /tmp/sdl/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/opt/sdl3 -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build /tmp/sdl/build
          cmake --install /tmp/sdl/build
      - name: Pack the link-time libraries
        run: |
          mkdir -p /tmp/sysroot
          cp -a /usr/lib/aarch64-linux-gnu/. /tmp/sysroot/
          cp -a /opt/sdl3/lib/. /tmp/sysroot/ 2>/dev/null || cp -a /opt/sdl3/lib*/. /tmp/sysroot/
          tar -C /tmp/sysroot -czf /tmp/arm64-sysroot.tgz .
          ls -l /tmp/arm64-sysroot.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: arm64-sysroot
          path: /tmp/arm64-sysroot.tgz
          retention-days: 3

  linux-arm64-build:
    needs: arm64-sysroot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch the patched compose-native repository (mytop-project/compose-native, branch mytop)
        shell: bash
        run: |
          set -euo pipefail
          temp="$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")"
          mkdir -p "$temp/cn-maven"
          base="https://github.com/mytop-project/compose-native/releases/download/v$CN_VERSION"
          curl --fail --location --silent --show-error --output "$temp/cn-maven.tar.gz"             "$base/compose-native-maven-$CN_VERSION.tar.gz"
          echo "$CN_SHA256  $temp/cn-maven.tar.gz" | sha256sum --check
          tar --force-local -xzf "$temp/cn-maven.tar.gz" -C "$temp/cn-maven"
          echo "CN_REPO=$temp/cn-maven" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: arm64-sysroot
          path: /tmp/dl
      - run: sudo mkdir -p /opt/arm64-sysroot && sudo tar -C /opt/arm64-sysroot -xzf /tmp/dl/arm64-sysroot.tgz
      - name: Cross-build for linuxArm64
        working-directory: spike/compose-native
        env:
          LINUX_ARM64_NATIVE_LIBRARY_DIRS: /opt/arm64-sysroot
        run: ./gradlew --no-daemon --stacktrace linkReleaseExecutableLinuxArm64
      - run: |
          cd spike/compose-native
          bin=$(find build/bin/linuxArm64 -type f -path '*releaseExecutable*' -name '*.kexe' | head -n1)
          ls -l "$bin"
          mkdir -p "$GITHUB_WORKSPACE/arm-bin"
          cp "$bin" "$GITHUB_WORKSPACE/arm-bin/mytop-spike.kexe"
      - uses: actions/upload-artifact@v4
        with:
          name: linuxArm64-binary
          path: arm-bin
          retention-days: 3

  linux-arm64-run:
    needs: [linux-arm64-build, arm64-sysroot]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $DEV_PACKAGES
      - uses: actions/cache@v4
        with:
          path: /opt/sdl3
          key: sdl3-${{ env.SDL_TAG }}-arm64-v1
      - name: Install SDL3
        run: |
          sudo cp -a /opt/sdl3/lib/. /usr/local/lib/ 2>/dev/null || sudo cp -a /opt/sdl3/lib*/. /usr/local/lib/
          sudo ldconfig
      - uses: actions/download-artifact@v4
        with:
          name: linuxArm64-binary
          path: arm-bin
      - name: Measure
        run: spike/compose-native/ci/report-linux.sh arm-bin/mytop-spike.kexe "$PWD/out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linuxArm64
          path: out

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch the patched compose-native repository (mytop-project/compose-native, branch mytop)
        shell: bash
        run: |
          set -euo pipefail
          temp="$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")"
          mkdir -p "$temp/cn-maven"
          base="https://github.com/mytop-project/compose-native/releases/download/v$CN_VERSION"
          curl --fail --location --silent --show-error --output "$temp/cn-maven.tar.gz"             "$base/compose-native-maven-$CN_VERSION.tar.gz"
          echo "$CN_SHA256  $temp/cn-maven.tar.gz" | sha256sum --check
          tar --force-local -xzf "$temp/cn-maven.tar.gz" -C "$temp/cn-maven"
          echo "CN_REPO=$temp/cn-maven" >> "$GITHUB_ENV"
      - name: Build and stage the distribution
        working-directory: spike/compose-native
        shell: bash
        run: ./gradlew --no-daemon --stacktrace linkReleaseExecutableMingwX64 prepareWindowsX64ReleaseDistribution
      - name: Measure
        working-directory: spike/compose-native
        shell: pwsh
        run: |
          $d = Get-ChildItem build -Recurse -Filter *.exe | Where-Object { $_.FullName -match 'istribution' } | Select-Object -First 1
          if (-not $d) { Get-ChildItem build -Recurse -Filter *.exe | ForEach-Object { $_.FullName }; throw "no distribution exe" }
          ci/report-windows.ps1 -Dist $d.DirectoryName -Out "$PWD\out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windowsX64
          path: spike/compose-native/out
